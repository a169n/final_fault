# Client authentication for postgres-primary and postgres-replica (Task 12; THREAT-MODEL.md B4.S1).
# Every network (host) connection needs a password, checked with scram-sha-256; the passwords are
# generated into the git-ignored .env and the roles are created by init/00-roles.sh.
#
# The one trust line is for the superuser over the Unix socket inside the container. Only someone
# who can already run `docker exec` on the host gets there, and that person controls the container
# anyway. It is what the image's init scripts and the operator use: the harness's reset between
# experiments (experiments/run.ts: TRUNCATE payments) and its replication check.
#
# TYPE  DATABASE     USER      ADDRESS   METHOD
local   all          postgres            trust
local   all          all                 scram-sha-256
host    replication  repl      all       scram-sha-256
host    all          all       all       scram-sha-256
