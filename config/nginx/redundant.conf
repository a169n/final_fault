# Endterm: two gateways behind nginx, so the gateway is no longer a single point of failure.
# Mounted as /etc/nginx/nginx.conf when NGINX_PROFILE=redundant (npm run up:endterm).
worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 4096;   # the high-load ramp holds ~110 client connections plus 2 upstream each
}

http {
  access_log off;            # the gateways log every request (with its rid); nginx would double it
  error_log /dev/stderr warn;
  server_tokens off;

  # Docker's embedded DNS. `resolve` below re-resolves the gateways every 2 s, so a restarted
  # gateway with a new IP is picked up, and nginx starts even if a gateway is not up yet.
  resolver 127.0.0.11 valid=2s ipv6=off;

  # One correlation id for the whole request: the client's, or nginx's own when there is none.
  # When nginx re-sends to the second gateway it carries the same id, so both attempts join in
  # one JSONL query. The gateway still validates it (app/core/context.py).
  map $http_x_request_id $rid {
    ""      $request_id;
    default $http_x_request_id;
  }

  upstream gateways {
    zone gateways 64k;
    # One failed attempt takes a gateway out for 5 s; nginx then probes it again with live traffic.
    server gateway-1:8080 max_fails=1 fail_timeout=5s resolve;
    server gateway-2:8080 max_fails=1 fail_timeout=5s resolve;
    keepalive 64;
  }

  server {
    listen 80;

    # Internal endpoints are not part of the public surface: Prometheus scrapes the gateways
    # directly on the compose network, and chaos injection goes to the services' own ports.
    location = /metrics { return 404; }
    location ^~ /chaos  { return 404; }

    location / {
      proxy_pass http://gateways;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Request-ID $rid;
      proxy_set_header X-Forwarded-For $remote_addr;   # overwrite: a client cannot spoof its address

      proxy_connect_timeout 1s;   # a dead gateway is detected in at most 1 s
      proxy_read_timeout 5s;      # a hung gateway: give up and try the other one

      # Failover to the other gateway on a connection error or a timeout, for every method.
      # `non_idempotent` makes nginx re-send a POST that the first gateway may already have
      # forwarded (it died mid-request). That is safe only because every POST is idempotent
      # downstream:
      #   - POST /api/payments: in endterm the gateway rejects it without an Idempotency-Key
      #     (400), so the re-sent request carries the client's key and the payment service
      #     returns the original payment instead of charging twice (S5).
      #   - POST /api/students and /api/timetables are upserts on a natural key (id, term).
      # 5xx responses are NOT retried here: the gateway already retries upstream replicas.
      proxy_next_upstream error timeout non_idempotent;
      proxy_next_upstream_tries 2;
      proxy_next_upstream_timeout 6s;
    }
  }
}
