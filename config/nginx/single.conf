# Baseline and midterm: nginx in front of the one gateway, so the topology matches the midterm
# (a single entry point and a single point of failure). Mounted as /etc/nginx/nginx.conf when
# NGINX_PROFILE=single. nginx is a transparent pass-through here: no failover, no extra
# timeouts (nginx defaults, longer than the harness's 10 s client timeout), no blocked paths,
# so baseline and midterm behave and measure as they did without it.
worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 4096;
}

http {
  access_log off;            # the gateway logs every request (with its rid)
  error_log /dev/stderr warn;
  server_tokens off;

  resolver 127.0.0.11 valid=2s ipv6=off;   # Docker DNS: follows a restarted gateway's new IP

  map $http_x_request_id $rid {
    ""      $request_id;
    default $http_x_request_id;
  }

  upstream gateways {
    zone gateways 64k;
    server gateway-1:8080 max_fails=0 resolve;   # never marked down: there is nothing to fail over to
    keepalive 64;
  }

  server {
    listen 80;

    location / {
      proxy_pass http://gateways;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Request-ID $rid;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_next_upstream off;
    }
  }
}
